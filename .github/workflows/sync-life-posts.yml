name: Sync Life Posts

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: sync-life-posts
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, '[Life]')
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install image tools
        run: npm ci

      - name: Build life feed from Issues
        run: node scripts/sync-life-issues.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit updated life feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add life/managed-posts.js assets/life/managed
          if git diff --cached --quiet; then
            echo "Life feed is already up to date."
            exit 0
          fi
          git commit -m "Sync life posts from Issues"
          git push
